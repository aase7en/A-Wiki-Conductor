name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    # Hosted runners expose a virtual WGL context that can access-violate
    # inside ModernGL before Python can activate the safe fallback.  Generic
    # CI therefore verifies the deterministic Canvas path; real WGL rendering
    # remains a workstation/installed-app E2E gate.
    env:
      A_CONDUCTOR_GPU_PARTICLES: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with test extra (validates packaging)
        run: python -m pip install -e .[test]
      # GUI (Tk), local-instance lifecycle, supervised-command lifecycle, and
      # every remaining core test file run in separate pytest processes. Hosted
      # Windows runners have emitted 0x80000003 faulthandler/GC breakpoint noise
      # when subprocess-heavy tests accumulate in one long-lived pytest process.
      - name: Run GUI test suite
        run: >-
          python -m pytest tests/test_desktop_ui.py tests/test_i18n.py
          tests/test_ui_usability.py tests/test_worker_crud.py
          tests/test_instance_manage.py tests/test_graceful_shutdown.py
          tests/test_worker_serena_settings.py tests/test_instance_monitor.py tests/test_instance_create.py tests/test_doctor_fixes.py tests/test_wizard_ui.py tests/test_setup_wizard.py tests/test_blurbs_i18n.py tests/test_project_disk_async.py tests/test_guide_html_ui.py -q
      - name: Run local-instance lifecycle suite
        run: python -m pytest tests/test_local_instances.py -q
      - name: Run supervised-command lifecycle suite
        run: python -m pytest tests/test_supervised_command_runner.py -q
      - name: Run remaining core suites one file per process
        shell: pwsh
        run: |
          $alreadyRun = @(
            "test_desktop_ui.py",
            "test_i18n.py",
            "test_ui_usability.py",
            "test_worker_crud.py",
            "test_instance_manage.py",
            "test_graceful_shutdown.py",
            "test_worker_serena_settings.py",
            "test_instance_monitor.py",
            "test_instance_create.py",
            "test_doctor_fixes.py",
            "test_wizard_ui.py",
            "test_setup_wizard.py",
            "test_blurbs_i18n.py",
            "test_project_disk_async.py",
            "test_guide_html_ui.py",
            "test_local_instances.py",
            "test_supervised_command_runner.py"
          )
          $files = Get-ChildItem -LiteralPath tests -Filter "test_*.py" -File |
            Where-Object { $_.Name -notin $alreadyRun } |
            Sort-Object Name
          if (-not $files) {
            throw "CORE_TEST_DISCOVERY_EMPTY"
          }
          foreach ($file in $files) {
            python -m pytest $file.FullName -q
            if ($LASTEXITCODE -ne 0) {
              throw "ISOLATED_TEST_FAILED: $($file.Name) exit $LASTEXITCODE"
            }
          }
      - name: Smoke test
        run: python -m a_conductor --smoke --database ${{ runner.temp }}\acond-ci-smoke.sqlite
      - name: Install Windows packaging toolchain
        run: python -m pip install pyinstaller==6.22.2
      - name: Build clean Portable and Setup executables
        shell: pwsh
        run: |
          python scripts/build_portable.py --distpath dist/ci
          if ($LASTEXITCODE -ne 0) {
            throw "PORTABLE_BUILD_FAILED: exit $LASTEXITCODE"
          }
          python scripts/build_installer.py --distpath dist/ci
          if ($LASTEXITCODE -ne 0) {
            throw "SETUP_BUILD_FAILED: exit $LASTEXITCODE"
          }
      - name: Verify frozen archive contents
        shell: pwsh
        run: |
          $portable = Join-Path $PWD "dist/ci/A-Sunday Conductor.exe"
          $setup = Join-Path $PWD "dist/ci/A-Sunday-Conductor-Setup.exe"
          if (-not (Test-Path -LiteralPath $portable -PathType Leaf)) {
            throw "PORTABLE_ARTIFACT_MISSING: $portable"
          }
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw "SETUP_ARTIFACT_MISSING: $setup"
          }
          $archive = Join-Path $env:RUNNER_TEMP "a-sunday-conductor-archive.txt"
          pyi-archive_viewer -r -b $portable | Set-Content -LiteralPath $archive
          if ($LASTEXITCODE -ne 0) {
            throw "PORTABLE_ARCHIVE_READ_FAILED: exit $LASTEXITCODE"
          }
          $archiveText = (Get-Content -LiteralPath $archive -Raw) -replace '\\', '/'
          $required = @(
            "assets/sunday-family-particle.png",
            "assets/logo-face.png",
            "a_conductor.gpu_particle_logo",
            "a_conductor.system_metrics",
            "moderngl/mgl",
            "glcontext/wgl",
            "pyopengltk",
            "OpenGL",
            "PIL/_imaging",
            "_tkinter",
            "tcl86t.dll",
            "tk86t.dll",
            "tkinterweb",
            "tkinterweb_tkhtml",
            "tkinterweb_tkhtml_extras",
            "markdown"
          )
          foreach ($entry in $required) {
            if (-not $archiveText.Contains($entry)) {
              throw "PORTABLE_ARCHIVE_ENTRY_MISSING: $entry"
            }
          }
          $setupArchive = Join-Path $env:RUNNER_TEMP "a-sunday-conductor-setup-archive.txt"
          pyi-archive_viewer -r -b $setup | Set-Content -LiteralPath $setupArchive
          if ($LASTEXITCODE -ne 0) {
            throw "SETUP_ARCHIVE_READ_FAILED: exit $LASTEXITCODE"
          }
          $setupArchiveText = (Get-Content -LiteralPath $setupArchive -Raw) -replace '\\', '/'
          $setupRequired = @(
            "payload/installer-branding.json",
            "payload/A-Sunday Conductor.exe",
            "payload/docs/USER-GUIDE.md",
            "payload/docs/USER-GUIDE-EN.md",
            "payload/THIRD-PARTY-NOTICES.md",
            "payload/assets/a-conductor.ico"
          )
          foreach ($entry in $setupRequired) {
            if (-not $setupArchiveText.Contains($entry)) {
              throw "SETUP_ARCHIVE_ENTRY_MISSING: $entry"
            }
          }
          foreach ($entry in @("a_conductor.desktop_ui", "PIL.Image", "OpenGL.GL")) {
            if ($setupArchiveText.Contains($entry)) {
              throw "SETUP_ARCHIVE_UNEXPECTED_ENTRY: $entry"
            }
          }
      - name: Smoke test Portable executable
        shell: pwsh
        run: |
          $portable = Join-Path $PWD "dist/ci/A-Sunday Conductor.exe"
          $database = Join-Path $env:RUNNER_TEMP "acond-frozen-smoke.sqlite"
          $process = Start-Process -FilePath $portable -ArgumentList @(
            "--smoke", "--database", $database
          ) -PassThru
          try {
            $process | Wait-Process -Timeout 90 -ErrorAction Stop
          } catch {
            $process | Stop-Process -Force -ErrorAction SilentlyContinue
            throw "PORTABLE_SMOKE_TIMEOUT: $portable"
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            throw "PORTABLE_SMOKE_FAILED: exit $($process.ExitCode)"
          }
          if (-not (Test-Path -LiteralPath $database -PathType Leaf)) {
            throw "PORTABLE_SMOKE_DATABASE_MISSING: $database"
          }
      - name: Archive Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: A-Sunday-Conductor-Windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/ci/A-Sunday Conductor.exe
            dist/ci/A-Sunday-Conductor-Setup.exe

  cross-platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with test extra
        run: python -m pip install -e .[test]
      # Platform-neutral suites first (Tk-dependent tests skip without a display)
      - name: Run platform-neutral suites (no Tk on headless runners)
        run: >-
          python -m pytest tests/test_platform_support.py
          tests/test_branding.py tests/test_sh_templates.py -q
      - name: Smoke test (headless)
        run: python -m a_conductor --smoke --database ${{ runner.temp }}/acond-smoke.sqlite
