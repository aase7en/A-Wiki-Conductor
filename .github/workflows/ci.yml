name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package (validates packaging)
        run: python -m pip install -e .
      - name: Run test suite
        run: python -m pytest tests/ -q
      - name: Smoke test
        run: python -m a_conductor --smoke --database ${{ runner.temp }}\acond-ci-smoke.sqlite
