name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with test extra (validates packaging)
        run: python -m pip install -e .[test]
      # GUI (Tk) and core suites run in separate processes: the Windows
      # runner's faulthandler has caught 0x80000003 breakpooint noise when
      # subprocess-heavy tests run in the same process after many Tk tests.
      - name: Run GUI test suite
        run: >-
          python -m pytest tests/test_desktop_ui.py tests/test_i18n.py
          tests/test_ui_usability.py tests/test_worker_crud.py
          tests/test_instance_manage.py tests/test_graceful_shutdown.py
          tests/test_worker_serena_settings.py tests/test_instance_monitor.py tests/test_instance_create.py tests/test_doctor_fixes.py tests/test_wizard_ui.py tests/test_setup_wizard.py tests/test_blurbs_i18n.py -q
      - name: Run core test suite
        run: >-
          python -m pytest tests/ -q
          --ignore=tests/test_desktop_ui.py
          --ignore=tests/test_i18n.py
          --ignore=tests/test_ui_usability.py
          --ignore=tests/test_worker_crud.py
          --ignore=tests/test_instance_manage.py
          --ignore=tests/test_graceful_shutdown.py
          --ignore=tests/test_worker_serena_settings.py
          --ignore=tests/test_instance_monitor.py
          --ignore=tests/test_instance_create.py
          --ignore=tests/test_doctor_fixes.py
          --ignore=tests/test_wizard_ui.py
          --ignore=tests/test_setup_wizard.py
          --ignore=tests/test_blurbs_i18n.py
      - name: Smoke test
        run: python -m a_conductor --smoke --database ${{ runner.temp }}\acond-ci-smoke.sqlite

  cross-platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with test extra
        run: python -m pip install -e .[test]
      # Platform-neutral suites first (Tk-dependent tests skip without a display)
      - name: Run platform-neutral suites (no Tk on headless runners)
        run: >-
          python -m pytest tests/test_platform_support.py
          tests/test_branding.py tests/test_sh_templates.py -q
      - name: Smoke test (headless)
        run: python -m a_conductor --smoke --database ${{ runner.temp }}/acond-smoke.sqlite
