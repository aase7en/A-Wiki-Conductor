version: 1
project: A-Wiki-Conductor
product: A-Sunday Conductor
entry:
  first: 00-AGENT-ENTRY.md
  then:
    - PROJECT-GRAPH.yaml
    - AGENTS.md
continuity_core:
  mandatory:
    - CURRENT-WORK.md
  conditional:
    active_work_order: when one exists or has already been claimed
    handoff: resume, transfer, unclear continuity, or CURRENT-WORK explicitly points to it
workflow_nodes:
  fast_execution:
    when: any non-trivial delivery work
    read:
      - docs/agent-collab/FAST_EXECUTION_PROTOCOL.md
      - docs/agent-collab/COLLAB_PROTOCOL.md
  fast_path_tool_routing:
    when: session/tool routing, external plugins, local/remote execution surfaces, delivery-latency reduction, CI fan-out/fan-in, parallel reviewer routing, or substantial session routing, parallel-lane fill/recycle, cross-executor continuation/takeover, temporary-lane closeout (A-FastTask)
    read:
      - docs/agent-collab/CAPABILITY_MATRIX.md
      - docs/agent-collab/TOOL_AND_FAST_PATH_ROUTING.md
      - .agents/skills/a-fasttask/SKILL.md
  cross_repo_binding:
    when: repo-role topology, CROSS_REPO or EXECUTION_SUBSTRATE_ONLY work, per-lane repo binding, exact-SHA compatibility sets, or set-level completion
    read:
      - docs/agent-collab/TOOL_AND_FAST_PATH_ROUTING.md
  multi_agent_coordination:
    when: parallel lanes, delegation, claim transfer, review handoff
    read:
      - COLLAB.md
      - docs/agent-collab/COLLAB_PROTOCOL.md
      - docs/agent-collab/CAPABILITY_MATRIX.md
      - docs/agent-collab/TOOL_AND_FAST_PATH_ROUTING.md
  architecture:
    when: product architecture, roadmap, trust boundary, durable workflow policy
    read:
      - PROJECT-PLAN.md
  ui_design:
    when: UI, UX, interaction, responsive behavior, motion, branding
    read:
      - DESIGN.md
  source_mutation:
    when: any src/a_conductor mutation
    read:
      - DEFECT_LESSONS.md
  zero_relay:
    when: external-agent automatic dispatch, ZCode/GLM result ingestion, repair/continue automation
    read:
      - docs/plans/2026-09-04-zero-relay-accelerator-roadmap.md
      - docs/work-orders/WO-P1-155-zero-relay-accelerator.md
  release:
    when: installer, frozen build, release, deployment, post-main verification
    read:
      - PROJECT-PLAN.md
      - DEFECT_LESSONS.md
rules:
  actual_state_over_chat_memory: true
  actual_state_does_not_override_user_safety_or_binding_policy: true
  claim_before_product_or_source_mutation: true
  governance_bootstrap_exception: bounded docs-only creation of initial work-order/claim in clean isolated scope; rerun mutation gate immediately
  safe_to_mutate_requires_known_identity_and_ownership: true
  deterministic_evidence_is_completion_authority: true
  default_wip:
    mutable_lanes: 3
    independent_read_only_review_lanes: 1
  repo_role_topology:
    definition_home: docs/agent-collab/TOOL_AND_FAST_PATH_ROUTING.md
    values: [CONTROL_PLANE_ONLY, EXECUTION_SUBSTRATE_ONLY, CROSS_REPO]
    projections_must_not_fork: true
  lane_binding_tuple: "repo -> worktree -> branch -> HEAD -> task/claim -> scope"
  one_repo_per_lane: true
  context_drift_blocks_lane_only: true
  cross_repo_wip_global_across_compatibility_set: true
  cross_repo_freeze_requires_exact_sha_set: true
  cross_repo_completion_set_level_with_authority_wo_pointer: true
routing:
  bounded_ready_implementation_default: capability_matrix_selected_executor
  current_preferred_candidate: GLM_ZCode
  selection_factors:
    - risk
    - task_class
    - capability
    - readiness
    - authorization
    - cost
    - availability
  architecture_trust_ssot_acceptance_merge_default: GPT_integrator
  deterministic_mechanics_default: native_tools
  zero_relay_transport:
    before_acceptance: one_pointer_command
    after_r3_acceptance: automatic_dispatch
