[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-wiki-conductor"
version = "0.7.0"
description = "A-Sunday Conductor — local autonomous control plane for coordinating AI agents, workers, and runtimes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.156.4,<0.157",
    "uvicorn>=0.54.0,<0.55",
    "Pillow>=10",
    "Markdown>=3.10.3,<4",
    "tkinterweb>=4.25.3,<5",
    "tkinterweb-tkhtml>=2.1.1,<3",
    "tkinterweb-tkhtml-extras>=1.3.1,<2",
    "moderngl>=5.12; platform_system == 'Windows'",
    "pyopengltk>=0.0.4; platform_system == 'Windows'",
]

[project.optional-dependencies]
test = ["pytest>=7", "jsonschema>=4.23", "httpx>=0.28.1,<0.29"]

[project.scripts]
a-conductor = "a_conductor.desktop_app:main"
a-conductor-web = "a_conductor.web_api:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
